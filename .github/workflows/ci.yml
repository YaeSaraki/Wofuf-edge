name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 后端 + 前端 + 运维脚本
    runs-on: ubuntu-latest
    # 正常一次跑完不到 1 分钟；20 分钟足够，超时说明某一步挂住了
    timeout-minutes: 20
    steps:
      # v7 起 action 跑在 Node 24 runtime 上；v4 声明的是 Node 20，已被 GitHub 弃用
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 20 已于 2026-04-30 EOL
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # npm workspaces：一次装好 backend/ 与 frontend/
      - name: 安装依赖
        run: npm ci

      - name: 类型检查（后端 + 前端）
        run: npm run typecheck

      # 走项目自己的构建脚本，而不是裸 npm run build：
      #  - 主题 / API 地址等 VITE_* 变量按 config.env 注入
      #    （config.env 不入库，脚本会自动从 config.env.example 生成一份）
      #  - CI 验证的就是真正部署用的那条构建路径
      - name: 构建（后端 + 前端 + 部署包）
        run: bash scripts/build.sh

      # 主题只有一处真源（scripts/lib.sh），其余副本不许漂移；
      # 顺带验证产物里注入的主题合法、首屏内联脚本语法没问题（= 不会白屏）
      - name: 主题一致性断言
        run: bash scripts/check-theme.sh

      - name: 运维脚本语法检查
        run: |
          for f in scripts/*.sh wofuf; do
            bash -n "$f" || exit 1
          done

      - name: 配置自检（用模板，不碰真实配置）
        run: |
          CONFIG_FILE=config.env.example bash scripts/config.sh check
